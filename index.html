<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Tòa 5D Online - Supabase Realtime</title>
    <!-- Nhúng thư viện Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #07090e; color: #f3f4f6; min-height: 100vh; overflow: hidden; }

        /* LOBBY SCREEN */
        #lobby-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            padding: 20px; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
        }
        .lobby-card {
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 40px; border-radius: 20px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .lobby-card h1 { text-align: center; margin-bottom: 24px; color: #60a5fa; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; background: #0b0f19; border: 1px solid #334155;
            border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .btn-primary {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* GAME SCREEN */
        #game-screen { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #07090e; }
        
        .top-hud {
            height: 60px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #1e293b;
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 5;
        }
        .hud-info { display: flex; gap: 15px; font-size: 13px; color: #94a3b8; }
        .hud-info span { background: #0b0f19; padding: 6px 14px; border-radius: 8px; border: 1px solid #334155; color: #e2e8f0; font-weight: 600; }
        .btn-exit { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-exit:hover { background: #b91c1c; }

        /* 5D PERSPECTIVE ROOM */
        .courtroom-container {
            flex: 1; position: relative; perspective: 1400px; overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #172033 0%, #06080f 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .stage-5d {
            width: 92%; max-width: 1200px; height: 72vh;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid rgba(59, 130, 246, 0.2); border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0,0,0,0.5);
            position: relative; display: grid;
            grid-template-columns: 1fr 1.2fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 20px; padding: 25px; transform-style: preserve-3d; transform: rotateX(8deg);
        }
        .seat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .avatar-box { font-size: 50px; margin-bottom: 6px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .seat-role { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .seat-name { font-size: 16px; font-weight: bold; color: #f8fafc; margin-top: 3px; }

        .pos-police { grid-column: 1 / 2; grid-row: 1 / 2; }
        .pos-judge { grid-column: 2 / 3; grid-row: 1 / 2; }
        .pos-prosecutor { grid-column: 1 / 2; grid-row: 2 / 3; }
        .pos-defendant { grid-column: 2 / 3; grid-row: 2 / 3; }
        .pos-defense { grid-column: 3 / 4; grid-row: 2 / 3; }

        /* CONTROL PANEL */
        .control-panel {
            height: 150px; background: rgba(15, 23, 42, 0.98); border-top: 1px solid #1e293b;
            display: flex; padding: 16px 24px; gap: 20px; align-items: center; justify-content: space-between; z-index: 5;
        }
        .dialogue-box {
            flex: 1; background: #07090e; border: 1px solid #334155; border-radius: 12px;
            padding: 14px 18px; font-size: 14px; color: #e2e8f0; height: 100%; overflow-y: auto; line-height: 1.5;
        }
        .action-buttons { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
        .btn-action {
            padding: 10px 14px; background: #3b82f6; color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px;
            transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .btn-action:hover { filter: brightness(1.1); }
        .btn-objection { background: #ef4444 !important; }
        .btn-hammer { background: #f59e0b !important; color: #0f172a !important; }

        /* OBJECTION OVERLAY */
        #objection-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 999;
        }
        #objection-text {
            font-size: 90px; font-weight: 900; color: #ef4444; text-transform: uppercase; font-style: italic;
            text-shadow: 0 0 30px #000, 0 0 60px #ef4444; animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.1); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake { animation: shakeScreen 0.4s ease-in-out; }
        @keyframes shakeScreen {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-12px, 6px); }
            40% { transform: translate(12px, -6px); }
            60% { transform: translate(-6px, -6px); }
            80% { transform: translate(6px, 6px); }
        }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen">
        <div class="lobby-card">
            <h1>Phiên Tòa 5D Online</h1>
            <div class="form-group">
                <label>Tên Nhân Vật Của Bạn</label>
                <input type="text" id="input-name" placeholder="Ví dụ: Luật Sư Tuấn" value="Luật Sư Tuấn">
            </div>
            <div class="form-group">
                <label>Mã Phòng Xét Xử (Toàn Cầu)</label>
                <input type="text" id="input-room" value="ROOM-GLOBAL-1">
            </div>
            <div class="form-group">
                <label>Chọn Vai Trò</label>
                <select id="select-role">
                    <option value="judge">👨‍⚖️ Thẩm Phán (Chủ Tọa)</option>
                    <option value="prosecutor">⚖️ Công Tố Viên</option>
                    <option value="defense" selected>🧑‍💼 Luật Sư Bào Chữa</option>
                    <option value="defendant">🧍‍♂️ B bị Cáo</option>
                    <option value="police">👮‍♂️ Cảnh Sát Áo Xanh</option>
                </select>
            </div>
            <button class="btn-primary" onclick="joinGame()">Vào Phòng Online</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="top-hud">
            <div class="hud-info">
                <span id="hud-room">Phòng: ...</span>
                <span id="hud-user">Người chơi: ...</span>
                <span id="hud-role">Vai trò: ...</span>
            </div>
            <button class="btn-exit" onclick="leaveGame()">Rời Phòng</button>
        </div>

        <div class="courtroom-container" id="court-container">
            <div class="stage-5d">
                <div class="seat-card pos-police">
                    <div class="avatar-box">👮‍♂️</div>
                    <div class="seat-role">Cảnh Sát Áo Xanh</div>
                    <div class="seat-name" id="name-police">Trống</div>
                </div>
                <div class="seat-card pos-judge">
                    <div class="avatar-box">👨‍⚖️</div>
                    <div class="seat-role">Thẩm Phán Chủ Tọa</div>
                    <div class="seat-name" id="name-judge">Trống</div>
                </div>
                <div class="seat-card" style="grid-column: 3 / 4; grid-row: 1 / 2; opacity: 0.7;">
                    <div class="avatar-box" style="font-size: 35px;">🏛️</div>
                    <div class="seat-role">Bồi Thẩm Đoàn</div>
                    <div class="seat-name">Hội Đồng</div>
                </div>
                <div class="seat-card pos-prosecutor">
                    <div class="avatar-box">⚖️</div>
                    <div class="seat-role">Công Tố Viên</div>
                    <div class="seat-name" id="name-prosecutor">Trống</div>
                </div>
                <div class="seat-card pos-defendant">
                    <div class="avatar-box">🧍‍♂️</div>
                    <div class="seat-role">Bị Cáo</div>
                    <div class="seat-name" id="name-defendant">Trống</div>
                </div>
                <div class="seat-card pos-defense">
                    <div class="avatar-box">🧑‍💼</div>
                    <div class="seat-role">Luật Sư Bào Chữa</div>
                    <div class="seat-name" id="name-defense">Trống</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="dialogue-box" id="dialogue-log">
                [Hệ thống]: Đang kết nối vào máy chủ Supabase toàn cầu...
            </div>
            <div class="action-buttons">
                <button class="btn-action btn-objection" onclick="sendAction('objection')">Hô: PHẢN ĐỐI!</button>
                <button class="btn-action btn-hammer" onclick="sendAction('hammer')">Gõ Búa Tuyên Án</button>
                <button class="btn-action" onclick="sendAction('statement')">Phát Biểu / Tranh Tụng</button>
            </div>
        </div>
    </div>

    <!-- OBJECTION OVERLAY -->
    <div id="objection-overlay">
        <div id="objection-text">PHẢN ĐỐI!</div>
    </div>

    <script>
        // --- THÔNG TIN SUPABASE ĐÃ ĐƯỢC TÍCH HỢP SẴN ---
        const SUPABASE_URL = 'https://luxaaxjliujydioiopbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4CFDPbpNVcSpast0SzxrRw_Y-obbQm5';
        // ----------------------------------------------

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = "";
        let myRoom = "";
        let myRole = "";
        let roomSubscription = null;

        async function joinGame() {
            myName = document.getElementById('input-name').value.trim() || "Vô Danh";
            myRoom = document.getElementById('input-room').value.trim() || "ROOM-GLOBAL-1";
            myRole = document.getElementById('select-role').value;

            document.getElementById('hud-room').innerText = `Phòng: ${myRoom}`;
            document.getElementById('hud-user').innerText = `Người chơi: ${myName}`;
            document.getElementById('hud-role').innerText = `Vai trò: ${document.getElementById('select-role').selectedOptions[0].text}`;

            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            // Lấy hoặc tạo phòng trên Supabase
            let { data, error } = await client.from('rooms').select('*').eq('room_code', myRoom).single();
            
            let roomState = data ? data.state : { players: {}, logs: [] };
            roomState.players[myRole] = myName;
            roomState.logs.push(`[Hệ thống]: ${myName} đã vào phòng với vai trò ${myRole}.`);

            if (!data) {
                await client.from('rooms').insert([{ room_code: myRoom, state: roomState }]);
            } else {
                await client.from('rooms').update({ state: roomState }).eq('room_code', myRoom);
            }

            updateUI(roomState);
            subscribeRealtimeRoom();
        }

        async function subscribeRealtimeRoom() {
            roomSubscription = client
                .channel('room-channel-' + myRoom)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${myRoom}` }, (payload) => {
                    if (payload.new && payload.new.state) {
                        updateUI(payload.new.state);
                    }
                })
                .subscribe();
        }

        async function sendAction(type) {
            let { data } = await client.from('rooms').select('*').eq('room_code', myRoom).single();
            if (!data) return;
            let roomState = data.state;

            if (type === 'statement') {
                let text = prompt("Nhập lời phát biểu/tranh tụng trước tòa:");
                if (!text) return;
                roomState.logs.push(`[${myRole.toUpperCase()} - ${myName}]: ${text}`);
            } else if (type === 'objection') {
                roomState.logs.push(`🔥 ${myName} vừa hô lớn: PHẢN ĐỐI!`);
                roomState.triggerObjection = { user: myName, time: Date.now() };
            } else if (type === 'hammer') {
                let res = prompt("Kết quả tuyên án:", "Bị cáo VÔ TỘI");
                if (!res) return;
                roomState.logs.push(`⚖️ THẨM PHÁN ĐÃ GÕ BÚA! Kết quả: ${res}`);
            }

            await client.from('rooms').update({ state: roomState }).eq('room_code', myRoom);
        }

        let lastObjectionTime = 0;
        function updateUI(state) {
            // Cập nhật tên ghế ngồi
            if(state.players) {
                document.getElementById('name-judge').innerText = state.players['judge'] || 'Trống';
                document.getElementById('name-prosecutor').innerText = state.players['prosecutor'] || 'Trống';
                document.getElementById('name-defense').innerText = state.players['defense'] || 'Trống';
                document.getElementById('name-defendant').innerText = state.players['defendant'] || 'Trống';
                document.getElementById('name-police').innerText = state.players['police'] || 'Trống';
            }

            // Cập nhật lịch sử chat / tranh tụng
            if(state.logs) {
                const logBox = document.getElementById('dialogue-log');
                logBox.innerHTML = state.logs.join('<br>');
                logBox.scrollTop = logBox.scrollHeight;
            }

            // Hiệu ứng phản đối từ người chơi khác
            if(state.triggerObjection && state.triggerObjection.time > lastObjectionTime) {
                lastObjectionTime = state.triggerObjection.time;
                showObjectionAnim(state.triggerObjection.user);
            }
        }

        function showObjectionAnim(name) {
            const overlay = document.getElementById('objection-overlay');
            const container = document.getElementById('court-container');
            overlay.style.display = 'flex';
            container.classList.add('shake');
            setTimeout(() => {
                overlay.style.display = 'none';
                container.classList.remove('shake');
            }, 800);
        }

        async function leaveGame() {
            if (roomSubscription) client.removeChannel(roomSubscription);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
